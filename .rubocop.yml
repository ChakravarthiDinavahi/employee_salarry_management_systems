# Omakase extends RuboCop’s defaults with Rails-focused rules and aligns with the
# community Ruby Style Guide (https://rubystyle.guide/) for layout, naming, and idioms.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  # App-specific paths (adjust if you add engines or non-standard roots)
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/schema.rb"
    - "bin/**/*"

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
